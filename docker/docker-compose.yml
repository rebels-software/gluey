# Gluey Daemon with MQTT + PostgreSQL
#
# Usage:
#   docker compose up -d
#   docker exec gluey gluey load /flows/my-workflow.gflow
#   docker exec gluey gluey start my-workflow
#   docker exec gluey gluey list
#
# Docker Compose creates a shared network automatically.
# Services reach each other by container name:
#   MQTT broker:  mqtt://mosquitto:1883
#   PostgreSQL:   Host=postgres;Port=5432;Database=gluey;Username=gluey;Password=gluey

services:
  gluey:
    image: ghcr.io/rebels-software/gluey:develop
    container_name: gluey
    restart: unless-stopped
    command: ["daemon", "start", "--port", "6262"]
    ports:
      - "6262:6262"   # Daemon API
      - "8080:8080"   # HTTP webhook input (adjust per workflow)
    volumes:
      - ./flows:/flows              # Your .gflow files
      - gluey-state:/root/.gluey   # Persist workflow state across restarts
    depends_on:
      - mosquitto
      - postgres

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"   # PostgreSQL (optional, for external access)
    environment:
      POSTGRES_DB: gluey
      POSTGRES_USER: gluey
      POSTGRES_PASSWORD: gluey
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  gluey-state:
  mosquitto-data:
  postgres-data:
